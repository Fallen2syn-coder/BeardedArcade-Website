<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBA Clip Poster — connected</title>
<style>
  body{margin:0;background:#08050C;color:#FFF6EC;font:16px/1.6 system-ui,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:48px 20px}
  h1{color:#F4A435;letter-spacing:.04em}
  code{display:block;background:#1C0E18;border:1px solid #8A5079;border-radius:6px;padding:14px;word-break:break-all;font-size:15px}
  button{background:#F4A435;color:#08050C;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:12px}
  small{color:#8E8071}
</style>
</head>
<body><main>
<h1>TBA Clip Poster</h1>
<p id="msg">Reading the authorization response…</p>
<code id="code"></code>
<button id="copy" hidden>Copy code</button>
<p><small>Paste this code back into the tool on your PC. This page stores nothing.</small></p>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error"), desc = q.get("error_description");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    msg.textContent = "TikTok authorized the app. Your one-time authorization code:";
    box.textContent = code; btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => btn.textContent = "Copied");
  } else if (err) {
    msg.textContent = "TikTok returned an error: " + err + (desc ? " — " + desc : "");
  } else {
    msg.textContent = "No authorization code in the URL. Start the connect step from the tool again.";
  }
</script>
</main></body>
</html>
